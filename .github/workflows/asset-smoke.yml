name: Cross-scene asset smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coupled-asset-feasibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned CPU geometry dependencies
        run: python -m pip install -r study-v7/requirements.txt
      - name: Build original procedural mechanisms
        run: python study-v7/assets.py .tools/v7-ci
      - name: Verify all coupled feasible references and failure controls
        run: python study-v7/controls.py .tools/v7-ci runs/coupled-v7-controls-ci
      - name: Export full detailed mechanism and motion
        run: python tools/export_compiled_v7.py --source .tools/v7-ci/service_cart --artifact .tools/v7-ci/service_cart/reference-standard --out runs/coupled-v7-export-ci
      - name: Download pinned Godot
        shell: bash
        run: |
          set -euo pipefail
          python tools/fetch_godot.py /tmp/godot-v7.zip
          mkdir -p /tmp/godot-v7
          unzip -q /tmp/godot-v7.zip -d /tmp/godot-v7
          chmod +x /tmp/godot-v7/Godot_v4.7.2-stable_linux.x86_64
      - name: Verify detailed GLB hierarchy and sampled motion in Godot
        shell: bash
        run: /tmp/godot-v7/Godot_v4.7.2-stable_linux.x86_64 --headless --path runtime --script res://inspect_geometry_v5.gd -- "$PWD/runs/coupled-v7-export-ci/roundtrip-job.json" > runs/coupled-v7-export-ci/godot.log 2>&1
      - name: Upload derived measurements only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coupled-asset-feasibility-${{ github.sha }}
          path: |
            runs/coupled-v7-controls-ci/verified.json
            runs/coupled-v7-controls-ci/summary.json
            runs/coupled-v7-controls-ci/intermediate_collision.json
            runs/coupled-v7-export-ci/export.json
            runs/coupled-v7-export-ci/godot.log
          if-no-files-found: warn
  cross-scene-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download pinned Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          python tools/fetch_godot.py /tmp/godot.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum --check
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Verify published asset hashes
        run: python tools/verify_assets.py
      - name: Evaluate both scenes and negative control
        run: python tests/smoke.py --godot /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --out runs/linux-ci --include-negative
      - name: Reproduce recorded development-study outcomes
        run: python tools/replay_study.py --godot /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --out runs/study-v1-ci
      - name: Reproduce controlled pose-adapter outcomes
        run: python tools/replay_v2.py --godot /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --out runs/study-v2-ci
      - name: Install pinned native CPU geometry dependencies
        run: python -m pip install -r study-v3/requirements.txt
      - name: Fetch and verify immutable public real-asset sources
        run: python tools/fetch_screening_assets.py
      - name: Reproduce real-asset mechanism screening
        run: python tools/replay_v3.py study-v3/recorded.json
      - name: Verify full-motion positive and negative controls
        run: python study-v4/controls.py runs/motion-controls-ci
      - name: Reproduce recorded full-motion adapter results and export locally
        run: python tools/replay_motion_v4.py --out runs/motion-ci --export-latest
      - name: Verify animated GLB roundtrip in Godot
        shell: bash
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path runtime --script res://inspect_motion_v4.gd -- "$PWD/runs/motion-ci/export/roundtrip-job.json" > runs/motion-ci/godot.log 2>&1
      - name: Upload exact evaluation results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cross-scene-regression-${{ github.sha }}
          path: |
            runs/linux-ci
            runs/study-v1-ci
            runs/study-v2-ci
            runs/motion-controls-ci/*.result.json
            runs/motion-controls-ci/verified.json
            runs/motion-ci/summary.json
            runs/motion-ci/*.evaluation.json
            runs/motion-ci/export/export.json
            runs/motion-ci/godot.log
          if-no-files-found: warn
  convex-proxy-feasibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned CPU geometry dependencies
        run: python -m pip install -r study-v6/requirements.txt
      - name: Fetch immutable public meshes and normalize sources
        run: |
          python tools/fetch_screening_assets.py
          python study-v5/prepare.py
      - name: Verify aperture, empty proxy and surface-displacement controls
        run: python study-v6/controls.py runs/convex-v6-controls-ci
      - name: Reproduce developer partition witness and denser query measurements
        run: python study-v6/witness.py runs/convex-v6-witness-ci
      - name: Prepare local-only convex shapes and posed query job
        run: python study-v6/engine_job.py runs/convex-v6-witness-ci runs/convex-v6-engine-ci
      - name: Download pinned Godot
        shell: bash
        run: |
          set -euo pipefail
          python tools/fetch_godot.py /tmp/godot-v6.zip
          mkdir -p /tmp/godot-v6
          unzip -q /tmp/godot-v6.zip -d /tmp/godot-v6
          chmod +x /tmp/godot-v6/Godot_v4.7.2-stable_linux.x86_64
      - name: Verify real compound convex shapes and posed engine queries
        shell: bash
        run: /tmp/godot-v6/Godot_v4.7.2-stable_linux.x86_64 --headless --path runtime --script res://inspect_proxies_v6.gd -- "$PWD/runs/convex-v6-engine-ci/job.json" "$PWD/runs/convex-v6-engine-ci/result.json" > runs/convex-v6-engine-ci/godot.log 2>&1
      - name: Upload derived measurements only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: convex-proxy-feasibility-${{ github.sha }}
          path: |
            runs/convex-v6-controls-ci/controls.json
            runs/convex-v6-witness-ci/record.json
            runs/convex-v6-engine-ci/result.json
            runs/convex-v6-engine-ci/godot.log
          if-no-files-found: warn
  geometry-rig-transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned CPU dependencies
        run: python -m pip install -r study-v3/requirements.txt
      - name: Fetch immutable public meshes and normalize sources
        run: |
          python tools/fetch_screening_assets.py
          python study-v5/prepare.py
      - name: Verify geometry/rig feasibility and failure controls
        run: python study-v5/controls.py runs/geometry-v5-controls-ci
      - name: Reproduce frozen transfer outputs without executing candidate code
        run: python tools/replay_geometry_v5.py --out runs/geometry-v5-ci --export-example
      - name: Download pinned Godot
        shell: bash
        run: |
          set -euo pipefail
          python tools/fetch_godot.py /tmp/godot-v5.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot-v5.zip' | sha256sum --check
          mkdir -p /tmp/godot-v5
          unzip -q /tmp/godot-v5.zip -d /tmp/godot-v5
          chmod +x /tmp/godot-v5/Godot_v4.7.2-stable_linux.x86_64
      - name: Verify generated mesh and joint hierarchy in Godot
        shell: bash
        run: /tmp/godot-v5/Godot_v4.7.2-stable_linux.x86_64 --headless --path runtime --script res://inspect_geometry_v5.gd -- "$PWD/runs/geometry-v5-ci/export/roundtrip-job.json" > runs/geometry-v5-ci/godot.log 2>&1
      - name: Upload derived measurements only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: geometry-rig-transfer-${{ github.sha }}
          path: |
            runs/geometry-v5-ci/summary.json
            runs/geometry-v5-ci/*.json
            runs/geometry-v5-ci/export/export.json
            runs/geometry-v5-ci/godot.log
            runs/geometry-v5-controls-ci/controls.json
            runs/geometry-v5-controls-ci/verified.json
          if-no-files-found: warn
